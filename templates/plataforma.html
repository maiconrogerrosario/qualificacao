{% extends "base.html" %}

{% block title %}Plataforma {{ nome }}{% endblock %}

{% block content %}

<h1>Plataforma: {{ nome }}</h1>

<h2>Sensores disponíveis</h2>

<ul>
{% for sensor in sensores %}
    <li>
        <a href="{{ url_for('formulario', sensor=sensor) }}">
            {{ sensor }}
        </a>
    </li>
{% else %}
    <li>Nenhum sensor encontrado.</li>
{% endfor %}
</ul>

{% endblock %}
